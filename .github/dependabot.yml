version: 2

# Обновление того, что запинено, но не собирается из исходников (#14).
#
# ⚠ ГРАНИЦА С `pins.yml`. Два механизма следят за внешним миром, и делят они его не по
# вкусу, а по тому, кто способен предложить готовую правку:
#   - `scripts/check-pin-drift.sh` (еженедельный job `pins`) — nginx, OpenSSL, bee2evp.
#     Это то, что собирается из исходников, и бампать его автоматически НЕЛЬЗЯ: у nginx
#     свежий mainline может быть хуже stable, а переход OpenSSL на новую ветку возможен
#     только если у bee2evp есть btls-патч под неё. Поэтому там — отчёт в issue, решение
#     за человеком.
#   - dependabot (этот файл) — сторонние actions и базовый образ Debian. Здесь апстрим
#     сам себе хозяин, обновление механическое, и PR с готовым диффом экономит работу.
# Пересечения между ними нет: ни один пин не обслуживается обоими.

updates:
  # Actions запинены на мажорные теги (`@v4`, `@v6`), то есть патчи приезжают сами, а вот
  # смена мажора — нет. Без этого мы однажды обнаружим, что сидим на версии, которую
  # GitHub уже не запускает: предупреждение про Node 20 в логах прогонов — ровно оно.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    commit-message:
      # Заголовок коммита — русский, повелительное наклонение (CLAUDE.md § «Коммиты»).
      # Dependabot допишет к префиксу имя зависимости и версии сам.
      prefix: Обновить
    labels:
      - dependencies

  # Базовый образ запинен по digest — иначе `debian:12-slim` менялся бы под нами молча, и
  # два одинаковых `docker build` давали бы разные образы. Плата за digest в том, что
  # обновления безопасности Debian сами не приезжают НИКОГДА, и следить за ними больше
  # некому: `check-pin-drift.sh` базу не смотрит.
  #
  # ⚠ РАБОТОСПОСОБНОСТЬ ЭТОГО БЛОКА НЕ ПОДТВЕРЖДЕНА. В `Dockerfile` образ задан через
  # `ARG DEBIAN_IMAGE=…` и подставляется как `FROM ${DEBIAN_IMAGE}`, а разбирает ли
  # dependabot такую косвенность — вопрос к его парсеру, и проверить это можно только
  # после мержа. Как убедиться: Insights → Dependency graph → Dependabot покажет, какие
  # манифесты он разобрал и когда проверял последний раз. Если базы там нет — эту слежку
  # надо переносить в `check-pin-drift.sh`, где парсер наш и проверяем тестом.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 2
    commit-message:
      prefix: Обновить
    labels:
      - dependencies
