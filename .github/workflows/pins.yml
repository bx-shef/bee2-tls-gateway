name: pins

# Наблюдение за внешним миром: отставание пинов от апстрима (#5) и сроки связки
# ГосСУОК (#4). Обе проверки об одном — что-то снаружи изменилось, а мы не заметили.
#
# ⚠ ОТДЕЛЬНЫЙ workflow, а не шаг в `ci`, и это не вкусовщина. Проверка ходит в сеть, а
# значит зависит от чужой доступности; попади она в обязательный статус-чек — падение
# nginx.org останавливало бы мержи. Здесь она не может никого заблокировать.
#
# ⚠ У отчёта ОБЯЗАН быть адресат. Красная джоба в репозитории, куда никто не смотрит, — это
# то же самое, что отсутствие джобы, и об этом прямо сказано в задаче. Поэтому при
# расхождении заводится (или обновляется) issue: она попадёт в список задач, а не в
# историю прогонов, которую не открывают.

on:
  schedule:
    # Раз в неделю, понедельник 06:00 UTC. Чаще незачем: релизы апстримов выходят не
    # ежедневно, а лишний шум делает отчёт фоновым и потому невидимым.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # Нужно, чтобы завести issue с отчётом — это и есть тот самый адресат.
  issues: write

concurrency:
  group: pins
  cancel-in-progress: false

jobs:
  drift:
    name: drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Сверка пинов с апстримом и сроков связки ГосСУОК
        id: drift
        run: |
          set -uo pipefail
          # Код 10 — «нашлись расхождения», 0 — «нет», 1 — «скрипт сломался».
          # Различать обязательно: сломавшаяся проверка не должна выглядеть как чистый прогон.
          out=$(bash scripts/check-pin-drift.sh 2>&1)
          rc=$?

          # Сроки связки ГосСУОК (#4) — здесь же, а не отдельной джобой: у обеих проверок
          # одна природа (наблюдение за внешним миром), один темп и один адресат. Разводить
          # их значило бы завести вторую джобу, на которую тоже никто не смотрит.
          # ⚠ Цепочку тут не проверить: стоковый openssl не читает ключи bign, скрипт честно
          # скажет «не проверено». Смыкание цепочки стережёт гейт 3 при каждой сборке.
          ca_out=$(bash scripts/check-ca.sh 2>&1)
          ca_rc=$?
          out="${out}"$'\n\n--- связка ГосСУОК ---\n'"${ca_out}"
          # Худший из двух: 1 важнее 10, потому что «сломалось» важнее «нашлось».
          if [ "$ca_rc" -eq 1 ] || [ "$rc" -eq 1 ]; then rc=1
          elif [ "$ca_rc" -eq 10 ]; then rc=10
          fi
          echo "$out"
          {
            echo "## Пины против апстрима и сроки связки"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Многострочный вывод в output — через разделитель, иначе обрежется первой строкой.
          {
            echo "report<<PINS_EOF"
            echo "$out"
            echo "PINS_EOF"
            echo "rc=$rc"
          } >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 1 ]; then
            echo "::error::проверка пинов сломалась — это не «расхождений нет»"
            exit 1
          fi
          exit 0

      - name: Завести или обновить issue с отчётом
        if: steps.drift.outputs.rc == '10'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.drift.outputs.report }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Вся логика в python: тело issue содержит кавычки, обратные апострофы и
          # переводы строк, и собирать его шеллом значит воевать с экранированием там,
          # где ошибка тихо испортит текст, а не уронит шаг.
          python3 scripts/report-pin-drift.py
