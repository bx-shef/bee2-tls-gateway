name: ci

# Этот workflow — обязательная проверка (required status check) для main.
# Имя job'а `ci` должно совпадать с контекстом в .github/rulesets/main-protection.json.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell-скрипты (shellcheck)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' '*.bash')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "shell-скриптов пока нет — пропускаем"
            exit 0
          fi
          printf 'проверяю: %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: Синтаксис JSON
        run: |
          status=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if python3 -m json.tool "$f" > /dev/null; then
              echo "ok   $f"
            else
              echo "FAIL $f" >&2
              status=1
            fi
          done < <(git ls-files '*.json')
          exit "$status"

      - name: Синтаксис YAML
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import subprocess, sys, yaml

          files = subprocess.run(
              ["git", "ls-files", "*.yml", "*.yaml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()

          failed = False
          for path in files:
              try:
                  with open(path, encoding="utf-8") as fh:
                      yaml.safe_load(fh)
              except Exception as exc:
                  print(f"FAIL {path}: {exc}", file=sys.stderr)
                  failed = True
              else:
                  print(f"ok   {path}")

          sys.exit(1 if failed else 0)
          PY

      - name: Конфигурация шлюза (плейсхолдеры, лог, TLS, allowlist, самотест)
        run: bash scripts/check-config.sh

      # Пины повторяются в нескольких файлах, и копия расходится с Dockerfile молча:
      # сборка не ломается, ломается смысл проверки, которая на копии стоит.
      - name: Пины согласованы между файлами
        run: bash scripts/check-pins.sh

      # Список путей — единственная граница безопасности шлюза, и с #7 её собирает КОД из
      # строки оператора. Значит у границы появились свои ошибки, и вот они проверяются:
      # что можно выразить, что нельзя, и что пустой список закрывает всё, а не открывает.
      - name: Генератор allowlist (что нельзя выразить через GW_ALLOW)
        run: bash scripts/check-allowlist.sh

      # Обход цепочки в `by-ca-bundle.sh` выбирает звено ПО ХЕШУ имени, а не по имени файла:
      # поколения УЦ сосуществуют, и `ruc3.cer` не обязан быть текущим издателем. Ошибка
      # выбора даёт связку, которая проходит любую синтаксическую проверку и потом 502-ит
      # 100% боевых запросов — то есть ломается далеко от причины, в бою.
      # ⚠ ПОЧЕМУ ЭТОТ ШАГ ВООБЩЕ ВОЗМОЖЕН В CI, хотя сам инструмент ручной: обход считает
      # хеши ИМЁН, а не подписи, и стокового OpenSSL для этого достаточно. Фикстуры
      # генерируются на месте, сеть не нужна — в отличие от живых шагов скрипта, которым
      # нужен банк. Проверка краснеет на подмене отбора именами файлов (показано мутацией
      # при вводе, PR #52).
      - name: Обход цепочки выбирает УЦ по хешу, а не по имени файла
        run: bash scripts/check-bundle-walk.sh

      # Сторож самого харнесса. Он ломает рабочее дерево и откатывает, но до #39 откат
      # случался только в нормальном потоке: убитый прогон оставлял мутацию в дереве, и
      # однажды там пролежала снятая проверка на «//» в пути — граница безопасности. Эта
      # проверка убивает прогон на середине и требует, чтобы дерево осталось чистым.
      # Идёт ~5 секунд и стоит ПЕРЕД полным прогоном: они делят замок и одновременно
      # работать не могут.
      - name: Мутационный харнесс не оставляет мутаций
        run: bash scripts/check-mutations-harness.sh

      # Сторож сторожей: ломает конфиг и пины нарочно и требует, чтобы шаги выше
      # покраснели — иначе проверка, которая никогда не краснеет, неотличима в CI от
      # работающей. Так была найдена мёртвая проверка про переменные nginx (см. шапку).
      - name: Мутационная проверка (сами проверки живы?)
        run: bash scripts/check-config-mutations.sh

      # Ловит ТИХИЙ неоткат: мутация применилась, `git checkout` в restore() молча не
      # сработал (например, гонка за .git/index.lock), прогон дошёл до конца зелёным — а
      # мутация осталась. Обработчики сигналов такой случай не покрывают: их никто не звал.
      #
      # ⚠ `if: always()` обязателен. Без него GitHub пропускает шаг, когда предыдущий
      # покраснел, — то есть ровно тогда, когда дерево вероятнее всего грязное.
      #
      # ⚠ Про SIGKILL здесь раньше было написано неверно, и это стоит помнить: от него
      # шаг не спасает — убитый job до этого шага просто не доходит. От SIGKILL на
      # эфемерном раннере защищает то, что рабочий каталог не переживает job.
      #
      # ⚠ Без списка файлов НАМЕРЕННО: `git diff` без путей смотрит все отслеживаемые
      # файлы. Список мутируемых лежал здесь третьей копией и ничем не сверялся — добавь
      # кто-то пятый файл в оба скрипта, эта копия молча продолжила бы смотреть на четыре.
      - name: Дерево чистое после мутаций
        if: always()
        run: |
          git diff --exit-code \
            || { echo "FAIL мутационный прогон оставил изменения в дереве" >&2; exit 1; }

      - name: Штамп Last reviewed в документации
        run: |
          status=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if head -5 "$f" | grep -q '^> Last reviewed: [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$'; then
              echo "ok   $f"
            else
              echo "FAIL $f: нет строки '> Last reviewed: ГГГГ-ММ-ДД' в первых 5 строках" >&2
              status=1
            fi
          done < <(git ls-files '*.md')
          exit "$status"

  image:
    name: image
    runs-on: ubuntu-latest
    # Сборка криптостека из исходников идёт долго; отдельный job, чтобы быстрые проверки
    # отдавали результат, не дожидаясь её.
    timeout-minutes: 45
    permissions:
      contents: read
      # Нужно только для публикации в GHCR на шаге ниже; на pull request не используется,
      # потому что сам шаг туда не заходит.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      # Сборка доказывает, что криптостек компилируется, цепочка сертификатов проверяется
      # и атрибуция лицензий доехала — четыре гейта живут внутри Dockerfile. Она НЕ
      # доказывает, что контейнер стартует: между
      # ними лежит entrypoint.sh (рендер envsubst, `nginx -t`, гейты корней, переход на
      # непривилегированного пользователя, healthcheck на bash /dev/tcp). Без смоука всё это
      # впервые исполнилось бы на сервере во время выката.
      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bee2-tls-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Банк не участвует: GW_UPSTREAM_HOST — IP-литерал (значит nginx не нужен DNS и
      # `nginx -t` не может упасть на резолве), а /healthz апстрима не касается.
      - name: Смоук — контейнер стартует и отвечает
        run: |
          set -euo pipefail
          docker run -d --name gw-smoke -p 127.0.0.1:1080:1080 \
            -e GW_UPSTREAM_HOST=127.0.0.1 -e GW_UPSTREAM_PORT=9345 \
            bee2-tls-gateway:ci
          for _ in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gw-smoke)" = healthy ] && break
            sleep 2
          done
          smoke_log=$(docker logs gw-smoke 2>&1)
          printf '%s\n' "$smoke_log"
          test "$(docker inspect -f '{{.State.Health.Status}}' gw-smoke)" = healthy
          # ---- счастливый путь самотеста (#42) --------------------------------------
          # Обе строки успеха README обещает оператору как ВИДИМЫЙ признак того, что
          # самотест прошёл, — значит это контракт, а не украшение лога. До #42 успех
          # подтверждался только отсутствием отказа: переименуй строки — и ничто бы не
          # покраснело, а оператор искал бы в логе то, чего там нет.
          #
          # ⚠ Лог берём ОДИН РАЗ в переменную, а не гоняем `docker logs | grep -q` трижды.
          # Причина не в экономии: `grep -q` закрывает вход на первом совпадении, и
          # `docker logs`, не успев дописать остальное, получает SIGPIPE и возвращает 141 —
          # под `set -o pipefail` шаг краснеет НА ИСПРАВНОМ контейнере.
          #
          # ⚠ ЗДЕСЬ БЫЛА ОШИБКА В РАССУЖДЕНИИ, и она стоила красного CI. Про соседний греп
          # ниже было написано, что он так падать не может, потому что ищет строку в конце
          # лога. Неправда: он ищет `status=502`, а это ПЕРВАЯ из трёх строк доступа — за
          # ней пишутся ещё 404 и 403. Окно там было всё это время, просто не срабатывало.
          # Вывод общий: не рассуждать, у какого грепа «есть окно», а не подставлять под
          # `grep -q` трубу вовсе.
          grep -q 'самотест ядра bee2: контрольные примеры и ДСЧ — OK' <<<"$smoke_log"
          grep -q 'самотест рабочего стека: движок bee2evp доступен, криптонабор BTLS предлагается — OK' <<<"$smoke_log"
          # Список путей — единственная граница безопасности шлюза. Утверждаем его СНАРУЖИ,
          # а не чтением конфига: check-config.sh проверяет намерение, смоук — поведение.
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code http://127.0.0.1:1080/healthz)" = 200
          test "$(code http://127.0.0.1:1080/)" = 404
          test "$(code http://127.0.0.1:1080/open-banking-authorize/v1.0/oauth2/token)" = 403
          test "$(code -X DELETE http://127.0.0.1:1080/open-banking/v1.0/accounts)" = 403
          # Работает непривилегированным.
          test "$(docker exec gw-smoke id -u)" = 10001
          docker rm -f gw-smoke

          # ---- allowlist действительно приходит из конфигурации (#7) ----------------
          # Утверждаем СНАРУЖИ и на ДРУГОМ списке: если бы пути остались зашиты в образ,
          # этот запуск вёл бы себя ровно как предыдущий, и подмена осталась бы незаметной.
          docker run -d --name gw-allow -p 127.0.0.1:1081:1080 \
            -e GW_UPSTREAM_HOST=127.0.0.1 -e GW_UPSTREAM_PORT=9345 \
            -e GW_ALLOW='GET /open-banking-dcr/' \
            bee2-tls-gateway:ci
          for _ in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gw-allow)" = healthy ] && break
            sleep 2
          done
          docker logs gw-allow
          test "$(docker inspect -f '{{.State.Health.Status}}' gw-allow)" = healthy
          code2() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          # Новый путь разрешён. Утверждаем КОНКРЕТНЫЙ код, а не «не 404»: `!= 404` проходит
          # и на curl-овом 000, то есть остался бы зелёным на шлюзе, который вообще молчит.
          # Апстрима нет, значит разрешённый путь обязан дать 502 — это и есть доказательство,
          # что запрос дошёл до proxy_pass, а не был отвергнут границей.
          test "$(code2 http://127.0.0.1:1081/open-banking-dcr/register)" = 502
          # А прежний, зашитый в образ, теперь закрыт — доказательство, что список сменился.
          test "$(code2 http://127.0.0.1:1081/open-banking/v1.0/accounts)" = 404
          # ⚠ Метод: список разрешает только GET, значит POST на ТОТ ЖЕ путь обязан дать 403.
          # Единственное место во всём проекте, где `limit_except` реально исполняется:
          # check-allowlist.sh выходит по GW_ALLOW_DUMP до nginx -t и видит лишь текст.
          # Без этой строки половина каждой записи GW_ALLOW не проверена ничем.
          test "$(code2 -X POST http://127.0.0.1:1081/open-banking-dcr/register)" = 403
          # И метка маршрута в логе — та, что сгенерирована из НАСТРОЕННОГО пути. Если бы
          # карта меток разъехалась с маршрутами, лог показывал бы route=none на разрешённом
          # запросе, то есть врал бы оператору, а все проверки кодов оставались бы зелёными.
          allow_log=$(docker logs gw-allow 2>&1)
          grep -q 'route=open-banking-dcr .*status=502' <<<"$allow_log"
          docker rm -f gw-allow

          # ---- пустой список закрывает всё, а не открывает --------------------------
          docker run -d --name gw-deny -p 127.0.0.1:1082:1080 \
            -e GW_UPSTREAM_HOST=127.0.0.1 -e GW_UPSTREAM_PORT=9345 \
            -e GW_ALLOW='' \
            bee2-tls-gateway:ci
          for _ in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gw-deny)" = healthy ] && break
            sleep 2
          done
          docker logs gw-deny
          test "$(docker inspect -f '{{.State.Health.Status}}' gw-deny)" = healthy
          code3() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code3 http://127.0.0.1:1082/healthz)" = 200
          test "$(code3 http://127.0.0.1:1082/open-banking/v1.0/accounts)" = 404
          test "$(code3 http://127.0.0.1:1082/open-banking-dcr/register)" = 404
          docker rm -f gw-deny

          # ---- самотест обязан РОНЯТЬ контейнер, а не просто печататься (#18) --------
          # Проверка, которая при провале не мешает старту, — украшение лога. Подсовываем
          # заведомо провальный bee2cmd и требуем, чтобы контейнер НЕ поднялся.
          # ⚠ Монтируем ПОВЕРХ штатного пути, а не подсовываем переменной окружения.
          # Переменная (был `GW_BEE2CMD`) оказалась не выключателем, а способом подделать
          # успех: заглушка с `exit 0` печатала бы настоящую строку «— OK». Проверку,
          # которую можно отменить переменной, на платёжном пути держать нельзя.
          # `timeout` обязателен: без него ошибка в самом тесте даёт не отказ, а зависание
          # шага до таймаута job'а — то есть двадцать минут вместо внятной строки.
          printf '#!/bin/sh\nexit 1\n' > /tmp/fake-bee2cmd
          chmod 0755 /tmp/fake-bee2cmd
          if timeout 60s docker run --rm \
               -v /tmp/fake-bee2cmd:/opt/btls/bin/bee2cmd:ro \
               -e GW_UPSTREAM_HOST=127.0.0.1 \
               bee2-tls-gateway:ci > /tmp/selftest.log 2>&1; then
            echo "FAIL: контейнер стартовал с провалившимся самотестом" >&2
            cat /tmp/selftest.log >&2
            exit 1
          fi
          grep -q 'самотест: контрольные примеры алгоритмов НЕ сошлись' /tmp/selftest.log
          echo 'ok: провал самотеста роняет контейнер'

          # ---- ветка `st rng` отдельно от `st alg` (#42) ----------------------------
          # Заглушка выше роняет ОБЕ команды одинаково, поэтому до отказа по ДСЧ
          # управление не доходило никогда: ветка выглядела покрытой, а исполнялась
          # только первая. Здесь `st alg` проходит, и падает именно `st rng` — иначе
          # смягчи кто-нибудь вторую проверку до предупреждения, смоук остался бы зелёным.
          printf '#!/bin/sh\n[ "$2" = alg ] && exit 0\nexit 1\n' > /tmp/fake-rng-bee2cmd
          chmod 0755 /tmp/fake-rng-bee2cmd
          if timeout 60s docker run --rm \
               -v /tmp/fake-rng-bee2cmd:/opt/btls/bin/bee2cmd:ro \
               -e GW_UPSTREAM_HOST=127.0.0.1 \
               bee2-tls-gateway:ci > /tmp/selftest-rng.log 2>&1; then
            echo "FAIL: контейнер стартовал с провалившимся самотестом ДСЧ" >&2
            cat /tmp/selftest-rng.log >&2
            exit 1
          fi
          # Именно сообщение про ДСЧ, а не любое падение: заглушка, сломавшая обе команды,
          # дала бы отказ по `st alg` и этот тест прошёл бы, ничего не проверив.
          grep -q 'генератор псевдослучайных чисел НЕ прошёл самотест' /tmp/selftest-rng.log
          echo 'ok: провал ДСЧ роняет контейнер своим сообщением'

      # Команда диагностики из `docs/PROCESS.md` §4 — единственный способ узнать ПРИЧИНУ
      # отказа апстрима. Замер 14.08.2026 показал, что access-лог её не отдаёт: два вида
      # отказа дают побайтово одинаковый набор переменных (разбор — `PROCESS.md` §5).
      #
      # ⚠ Проверяется ЗАПУСКОМ, а не переписыванием в документ. Команда, которая живёт
      # только в тексте, протухает молча: сменится путь к бинарю или к связке — оператор
      # узнает об этом в аварию, когда она нужнее всего. Здесь она обязана РАЗЛИЧИТЬ три
      # случая, и все три строятся без банка.
      #
      # ⚠ Успешный исход добавлен последним и был самым дорогим пропуском (#61). Пока
      # смоук гонял только два отказа, строку успеха не сторожило ничто — и она врала:
      # таблица обещала `Verify return code: 0 (ok)` и `Cipher is`, а команда с `-brief`
      # печатает `Verification: OK` и `Ciphersuite:`. Оператор в аварии искал бы
      # обещанное и не нашёл. Поднять собеседника по BTLS стало чем только после #58.
      - name: Команда диагностики различает причины отказа
        run: |
          set -euo pipefail
          # ⚠ Флаги НЕ переписаны сюда руками — они ИЗВЛЕКАЮТСЯ из `docs/PROCESS.md` §4.
          # Рукописная копия сторожила бы саму себя: поправь кто-нибудь путь к связке в
          # документе, и CI остался бы зелёным, а оператор запустил бы неработающее.
          # Теперь исполняется ровно то, что напечатано оператору; расходиться нечему.
          flags=$(python3 - <<'PY'
          import re, sys
          t = open("docs/PROCESS.md", encoding="utf-8").read()
          m = re.search(r"```bash\n(docker exec[^`]*?s_client.*?)\n```", t, re.S)
          if not m:
              sys.exit("не нашёл блок с командой диагностики в PROCESS.md §4")
          cmd = " ".join(m.group(1).replace("\\\n", " ").split())
          tail = cmd.split("/opt/btls/bin/openssl", 1)[1]
          print(tail.replace("</dev/null", "").strip())
          PY
          )
          echo "флаги из документа: $flags"

          # ⚠ Строки успеха тоже НЕ переписаны сюда руками — они извлекаются из той самой
          # таблицы «что читать в выводе», по которой оператор и опознаёт успех. Ровно эта
          # копия и разъехалась в #61: openssl печатал одно, таблица обещала другое, и
          # никакой шаг CI на это не смотрел. Теперь смотрит: разъедется снова — покраснеет.
          ok_raw=$(python3 - <<'PY'
          import re, sys
          t = open("docs/PROCESS.md", encoding="utf-8").read()
          row = next((ln for ln in t.splitlines()
                      if ln.startswith("|") and "**всё в порядке**" in ln), None)
          if row is None:
              sys.exit("не нашёл строку успеха в таблице PROCESS.md §4")
          toks = re.findall(r"`([^`]+)`", row.split("|")[1])
          if not toks:
              sys.exit("в строке успеха таблицы нет ни одной строки в обратных кавычках")
          print("\n".join(toks))
          PY
          )
          mapfile -t ok_tokens <<<"$ok_raw"
          printf 'строки успеха из таблицы: %s\n' "${ok_tokens[*]}"

          # Дополнительные аргументы `docker run` для случая успеха: сеть с апстримом и
          # подменённая связка. Пустой массив для первых двух случаев — им хватает образа.
          diag_opts=()
          diag() {  # diag <хост> <порт>
            local f=${flags//apibel.priorbank.by:9345/$1:$2}
            f=${f//apibel.priorbank.by/$1}
            # Разбиение на слова здесь НАМЕРЕННОЕ — флаги приходят одной строкой.
            # shellcheck disable=SC2086
            timeout 60s docker run --rm "${diag_opts[@]}" \
              --entrypoint /opt/btls/bin/openssl \
              bee2-tls-gateway:ci $f </dev/null 2>&1 || true
          }

          # Случай 1: на порту никого. Ожидаем отказ СОЕДИНЕНИЯ.
          out_down=$(diag 127.0.0.1 9345)
          printf '%s\n' "$out_down" | tail -3
          grep -qi 'connect:\|Connection refused\|errno=' <<<"$out_down" \
            || { echo "FAIL: отказ соединения не опознан по выводу" >&2; exit 1; }
          echo 'ok: недоступный апстрим виден как отказ соединения'

          # Случай 2: на порту обычный TLS-сервер. Команда теперь ограничена теми же
          # наборами, что и шлюз, поэтому падает на согласовании — ровно как упал бы шлюз.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=diag-probe' -keyout /tmp/diag.key -out /tmp/diag.crt 2>/dev/null
          openssl s_server -quiet -accept 9346 \
            -cert /tmp/diag.crt -key /tmp/diag.key >/dev/null 2>&1 &
          s_server_pid=$!
          sleep 2
          bridge=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          out_tls=$(diag "$bridge" 9346)
          kill "$s_server_pid" 2>/dev/null || true
          printf '%s\n' "$out_tls" | tail -3
          # ⚠ Требуем ИМЕННО ошибку проверки, а не любой непустой вывод: недоступный порт
          # тоже даёт непустой вывод, и проверка «что-то напечаталось» прошла бы вхолостую.
          # ⚠ Паттерн широкий НАМЕРЕННО: точная формулировка зависит от того, где именно
          # оборвалось рукопожатие (нет общего набора, alert от сервера, ошибка проверки).
          # Узкий паттерн здесь давал бы красное на исправном коде при смене версии OpenSSL.
          grep -qi 'handshake failure\|no ciphers\|no cipher match\|alert\|verify error\|verification error\|unable to verify\|self.signed' <<<"$out_tls" \
            || { echo "FAIL: отказ на уровне TLS не опознан по выводу" >&2; exit 1; }
          echo 'ok: отвечающий, но неподходящий апстрим виден как отказ TLS'

          # Случай 3: собеседник, который отвечает ПРАВИЛЬНО. Апстрим — из того же образа
          # (замерено 14.08.2026: наш стек выпускает bign-сертификаты и говорит сам с собой
          # на обязательном криптонаборе), связка — его же одноразовый УЦ, смонтированный
          # поверх штатного пути.
          #
          # ⚠ Адрес подставляется, а не берётся из документа дословно, и это осознанно.
          # Дословный прогон потребовал бы выписать сертификат с SAN на ЧУЖОЕ имя, которым
          # мы не владеем; УЦ здесь одноразовый и никому не доверенный, но привычка
          # выписывать себе чужие имена переносится туда, где УЦ уже настоящий. Потерь при
          # этом нет: подстановка меняет ТОЛЬКО адрес и делает это во всех трёх местах
          # сразу — ровно то, что §4 предписывает оператору с другим апстримом, — а флаги
          # (`-CAfile`, `-cipher`, `-tls1_2`, `-verify_hostname`, `-brief`) исполняются
          # нетронутыми, и проверка имени остаётся настоящей.
          PKI=/tmp/diag-pki
          rm -rf "$PKI"; mkdir -p "$PKI"; chmod 700 "$PKI"
          # Уборка через trap: падение любого assert'а ниже иначе оставит сеть и контейнер,
          # и следующий прогон на self-hosted умрёт на `network already exists` — красным,
          # который не имеет отношения к делу.
          cleanup() {
            docker rm -f btls-diag-upstream >/dev/null 2>&1 || true
            docker network rm diagnet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # `timeout`: `genpkey` тянет из ДСЧ, и на чужом хосте он может не набрать
          # энтропии — без ограничения это зависание до таймаута job'а вместо внятной строки.
          # `--user`: фикстура закрывает ключи `chmod 600`, а s_server ниже работает под тем
          # же uid — иначе он не прочитает собственный ключ (стоило одного красного прогона).
          timeout 120s docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PKI:/pki" -v "$PWD/scripts:/scripts:ro" \
            --entrypoint bash bee2-tls-gateway:ci \
            /scripts/make-btls-fixture.sh /pki btls-diag-upstream

          # ⚠ Имя контейнера здесь ОБЯЗАНО совпадать с SAN листа: в пользовательской сети
          # оно и есть DNS-имя, а `-verify_hostname` сверяет имя, а не только цепочку.
          docker network create diagnet >/dev/null
          docker run -d --name btls-diag-upstream --network diagnet \
            --user "$(id -u):$(id -g)" -v "$PKI:/pki:ro" \
            --entrypoint /opt/btls/bin/openssl bee2-tls-gateway:ci \
            s_server -accept 9345 -cert /pki/leaf.crt -key /pki/leaf.key \
            -cipher DHE-BIGN-WITH-BELT-CTR-MAC-HBELT -tls1_2 -www >/dev/null
          # Ждём, пока апстрим реально СЛУШАЕТ. Фиксированная пауза на загруженном раннере
          # проигрывает гонку, и шаг краснеет с указанием на TLS, которого не было.
          listening=
          for _ in $(seq 1 30); do
            if docker exec btls-diag-upstream bash -c "</dev/tcp/127.0.0.1/9345" 2>/dev/null; then
              listening=yes; break
            fi
            sleep 1
          done
          [ -n "$listening" ] || {
            echo "FAIL: BTLS-апстрим не слушает 9345" >&2
            docker logs btls-diag-upstream 2>&1 | tail -20 >&2
            exit 1
          }

          diag_opts=(--network diagnet
                     -v "$PKI/ca.crt:/etc/crypto-gw/ca/gossuok-bundle.pem:ro")
          out_ok=$(diag btls-diag-upstream 9345)
          diag_opts=()
          # ⚠ Печатаем вывод ЦЕЛИКОМ, и это безопасно ровно из-за `-brief`: в нём нет ни
          # `Master-Key`, ни тикета сессии, ни PEM сертификата. Заодно оператор видит в
          # логе CI, как выглядит успешный прогон, — а не только как выглядят отказы.
          printf '%s\n' "$out_ok"

          for tok in "${ok_tokens[@]}"; do
            grep -qF "$tok" <<<"$out_ok" || {
              echo "FAIL: успешное рукопожатие не печатает «$tok» — таблица PROCESS.md §4 врёт оператору" >&2
              exit 1
            }
          done
          # Последняя ячейка таблицы обещает не только успех, но и что ВИДНО согласованный
          # набор. Без этой строки обещание держалось бы на слове: `Ciphersuite` мог бы
          # печататься пустым, и все проверки выше остались бы зелёными.
          grep -q 'Ciphersuite:.*DHE-BIGN-WITH-BELT-CTR-MAC-HBELT' <<<"$out_ok" \
            || { echo "FAIL: в выводе не видно согласованного криптонабора" >&2; exit 1; }
          echo 'ok: исправный BTLS-апстрим виден как успех, и набор в выводе назван'

          docker rm -f btls-diag-upstream >/dev/null

          # ⚠ И главное: три случая РАЗЛИЧАЮТСЯ. Без этих строк проверки выше могли бы
          # срабатывать на одном и том же тексте, и команда «различает» лишь на словах.
          if grep -qi 'handshake failure\|no ciphers\|verify error\|verification error\|self.signed' <<<"$out_down"; then
            echo "FAIL: вывод недоступного порта тоже похож на отказ TLS" >&2
            exit 1
          fi
          # ⚠ И обратная сторона — иначе «различает» проверялось бы в одну сторону.
          if grep -qi 'Connection refused\|errno=' <<<"$out_tls"; then
            echo "FAIL: вывод отказа TLS тоже похож на отказ соединения" >&2
            exit 1
          fi
          # ⚠ И третья сторона, без которой успех не стоит ничего: строки успеха не должны
          # встречаться НИ В ОДНОМ отказе. Иначе оператор, ищущий в выводе `Verification: OK`,
          # прочитал бы «всё в порядке» на упавшем рукопожатии — то есть команда врала бы
          # именно в аварию, ради которой написана.
          for tok in "${ok_tokens[@]}"; do
            for out in "$out_down" "$out_tls"; do
              if grep -qF "$tok" <<<"$out"; then
                echo "FAIL: строка успеха «$tok» встречается и в выводе отказа" >&2
                exit 1
              fi
            done
          done
          echo 'ok: успех и обе причины отказа в выводе различимы'

      # Ротация корней делается НАБОРОМ: новый корень кладётся рядом со старым заранее,
      # старый убирается после перехода — простоя при этом нет. Так написано в PROCESS.md
      # §4, и до #49 это было УТВЕРЖДЕНИЕМ, а не измерением: что шлюз принимает связку с
      # двумя корнями сразу, никто не проверял ни разу.
      #
      # ⚠ ЧТО ЭТОТ ШАГ ДОКАЗЫВАЕТ, А ЧТО НЕТ — важнее самого шага.
      # Доказывает: посторонний лишний сертификат в связке не портит УЖЕ ВЕРНУЮ проверку
      # цепочки, и счётчик корней при этом растёт (то есть подменённый том виден).
      # НЕ доказывает: что настоящий новый корень ГосСУОК подойдёт (для этого нужен он
      # сам), и что живое рукопожатие через proxy_ssl_trusted_certificate переживёт
      # двойную связку — это другой код-путь, и он остаётся ручным прогоном владельца.
      #
      # ⚠ Проверка цепочки в entrypoint.sh — секция 2, помечена `LOUD, not fatal`: она
      # предупреждает, а не блокирует старт. Поэтому требуем ИМЕННО строку «— OK», а не
      # «контейнер поднялся»: подниматься он будет в любом случае.
      - name: Ротация — связка с лишним корнем не ломает проверку цепочки
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=rotation-probe' -keyout /tmp/rot.key -out /tmp/rot.crt 2>/dev/null
          cat ca/gossuok-bundle.pem /tmp/rot.crt > /tmp/rot-bundle.pem
          before=$(grep -c 'BEGIN CERTIFICATE' ca/gossuok-bundle.pem || true)
          after=$(grep -c 'BEGIN CERTIFICATE' /tmp/rot-bundle.pem || true)
          echo "корней в связке: было $before, стало $after"
          test "$after" -eq "$((before + 1))"

          docker run -d --name gw-rot -p 127.0.0.1:1092:1080 \
            -e GW_UPSTREAM_HOST=127.0.0.1 -e GW_UPSTREAM_PORT=9345 \
            -v /tmp/rot-bundle.pem:/etc/crypto-gw/ca/gossuok-bundle.pem:ro \
            bee2-tls-gateway:ci
          for _ in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gw-rot)" = healthy ] && break
            sleep 2
          done
          rot_log=$(docker logs gw-rot 2>&1)
          printf '%s\n' "$rot_log"
          # ⚠ Обе строки ниже печатаются ДО `nginx -t`, поэтому без этой проверки шаг
          # прошёл бы и на контейнере, который не поднялся по другой причине.
          test "$(docker inspect -f '{{.State.Health.Status}}' gw-rot)" = healthy
          docker rm -f gw-rot >/dev/null

          # Том действительно подменён — иначе шаг проверял бы штатную связку и проходил
          # бы вхолостую, ничего не сказав про ротацию.
          grep -q "корни ГосСУОК: $after сертификат(ов)" <<<"$rot_log" \
            || { echo "FAIL: контейнер видит не подменённую связку" >&2; exit 1; }
          grep -q 'проверка цепочки: bundle подтверждает эталонный сертификат банка — OK' <<<"$rot_log" \
            || { echo "FAIL: лишний корень сломал проверку цепочки" >&2; exit 1; }
          echo 'ok: связка из трёх сертификатов подтверждает эталон банка'

          # ⚠ ОТРИЦАТЕЛЬНЫЙ СЛУЧАЙ, и без него всё выше не стоит ничего. Проверка,
          # у которой нет сценария ПРОВАЛА, не отличает честный «— OK» от зашитого:
          # замени кто-нибудь `openssl verify` на безусловный `log '… — OK'`, и шаг выше
          # остался бы зелёным. Здесь связка заведомо негодная — только посторонний
          # сертификат, без настоящих корней ГосСУОК, — и мы требуем ветку ВНИМАНИЕ.
          docker run -d --name gw-rot-bad -p 127.0.0.1:1093:1080 \
            -e GW_UPSTREAM_HOST=127.0.0.1 -e GW_UPSTREAM_PORT=9345 \
            -v /tmp/rot.crt:/etc/crypto-gw/ca/gossuok-bundle.pem:ro \
            bee2-tls-gateway:ci
          for _ in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gw-rot-bad)" = healthy ] && break
            sleep 2
          done
          bad_log=$(docker logs gw-rot-bad 2>&1)
          printf '%s\n' "$bad_log"
          docker rm -f gw-rot-bad >/dev/null

          grep -q 'НЕ подтверждает эталонный сертификат банка' <<<"$bad_log" \
            || { echo "FAIL: негодная связка не вызвала предупреждения" >&2; exit 1; }
          if grep -q 'проверка цепочки: bundle подтверждает эталонный сертификат банка — OK' <<<"$bad_log"; then
            echo "FAIL: негодная связка дала «— OK» — проверка цепочки не исполняется" >&2
            exit 1
          fi
          echo 'ok: негодная связка краснеет — значит «— OK» выше настоящий'

      # ⚠ ВТОРАЯ проверка цепочки — та, через которую идёт весь боевой трафик (#58).
      # Шаг выше проверяет `openssl verify` при старте: утилита, отдельный процесс,
      # предупреждающий гейт. Здесь проверяется `proxy_ssl_trusted_certificate` ВНУТРИ
      # nginx — другая реализация, другой X509_STORE, другой момент жизни процесса. Из
      # того, что двойную связку пережил `openssl verify`, не следует, что её переживёт
      # рукопожатие, и до этого шага вторую половину не проверяло ничто.
      #
      # Живой банк тут недостижим (порт 9345 из GitHub Actions закрыт), поэтому апстрим
      # мы поднимаем СВОЙ, из того же образа: замерено 14.08.2026, что наш стек умеет
      # выпускать bign-сертификаты и говорить с собой на обязательном криптонаборе.
      #
      # ⚠ Оба якоря в связке — bign, и это НЕ придирка. Настоящая ротация кладёт рядом со
      # старым корнем ГосСУОК новый, тоже bign, а ключи bign стоковый OpenSSL не читает в
      # принципе. Возьми мы вторым якорем RSA-корень — хранилище разбирало бы его
      # встроенным кодом, и «второй bign-якорь ломает store» прошло бы проверку зелёным,
      # чтобы вылезти в день настоящего перевыпуска. Ровно тот отказ, ради которого всё.
      #
      # ⚠ Что это доказывает: лишний якорь доверия не мешает nginx проверить цепочку и
      # договориться. Чего НЕ доказывает: что подойдёт настоящий корень ГосСУОК и что с
      # двойной связкой договорится настоящий банк. Это ручной прогон владельца,
      # docs/PROCESS.md §4 — и он остаётся обязательным.
      - name: Ротация — двойную связку переживает и рукопожатие nginx, не только старт
        run: |
          set -euo pipefail
          PKI=/tmp/btls-pki
          rm -rf "$PKI"; mkdir -p "$PKI"; chmod 700 "$PKI"

          # ⚠ Уборка через trap, а не строкой в конце. Без неё падение ЛЮБОГО assert'а
          # оставляет сеть `btlsnet` и контейнеры: на эфемерном раннере это сходит с рук,
          # на self-hosted следующий прогон умрёт на `network already exists` — красным,
          # который не имеет отношения к делу и маскирует настоящий результат.
          cleanup() {
            docker rm -f btls-upstream gw-live gw-live-bad >/dev/null 2>&1 || true
            docker network rm btlsnet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # ⚠ `timeout` обязателен по той же причине, что и у шагов выше: без него ошибка
          # в самом тесте даёт не отказ, а зависание до таймаута job'а — двадцать минут
          # вместо внятной строки. `genpkey` тянет из ДСЧ, а он на чужом хосте может и не
          # набрать энтропии (entrypoint.sh §0 про это предупреждает отдельно).
          #
          # ⚠ `--user` вместо `chmod 777` на каталог с ключами. Право записи в каталог, а
          # не владение файлом, решает, можно ли подменить файл; открытый каталог отменял
          # бы `chmod 600`, который фикстура ставит на ключи, — и подмена ca.crt между
          # выпуском и рукопожатием как раз зеленит отрицательный случай.
          fixture() {
            timeout 120s docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PKI:/pki" -v "$PWD/scripts:/scripts:ro" \
              --entrypoint bash bee2-tls-gateway:ci \
              /scripts/make-btls-fixture.sh "$1" "$2"
          }
          fixture /pki        btls-probe-upstream
          fixture /pki/second btls-probe-other

          # Связка из ДВУХ якорей, оба bign: наш УЦ (он подписал лист апстрима) и второй,
          # посторонний. Ровно та форма, в которой связка живёт во время ротации.
          cat "$PKI/ca.crt" "$PKI/second/ca.crt" > "$PKI/bundle-two.pem"
          want=$(grep -c 'BEGIN CERTIFICATE' "$PKI/bundle-two.pem")
          test "$want" -eq 2
          echo "якорей в связке: $want"

          # Ждём, пока апстрим реально СЛУШАЕТ, а не «прошло три секунды». Фиксированная
          # пауза на загруженном раннере проигрывает гонку, и шаг краснеет по причине,
          # не имеющей отношения к проверяемому.
          wait_listen() {
            for _ in $(seq 1 30); do
              docker exec "$1" bash -c "</dev/tcp/127.0.0.1/9345" 2>/dev/null && return 0
              sleep 1
            done
            echo "FAIL: апстрим $1 не слушает 9345" >&2
            docker logs "$1" 2>&1 | tail -20 >&2
            exit 1
          }
          # ⚠ Цикл ожидания ОБЯЗАН кончаться проверкой, а не истечением. Без неё
          # не поднявшийся контейнер выглядит как провалившееся рукопожатие: шаг красный,
          # но показывает пальцем на TLS, которого не было.
          wait_healthy() {
            for _ in $(seq 1 20); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$1")" = healthy ] && return 0
              sleep 2
            done
            echo "FAIL: контейнер $1 не стал healthy" >&2
            docker logs "$1" 2>&1 | tail -30 >&2
            exit 1
          }

          docker network create btlsnet >/dev/null
          # ⚠ Имя апстрима в сети = SAN листа: `proxy_ssl_verify on` сверяет ИМЯ, а не
          # только цепочку. Один апстрим обслуживает оба случая — вторая его копия
          # означала бы две команды `s_server`, которые обязаны меняться синхронно.
          # ⚠ `--user` здесь обязателен и стоил одного красного прогона. Фикстура пишет
          # ключи от uid раннера и закрывает их `chmod 600`; апстрим по умолчанию работает
          # под `gw` (uid 10001) и свой же ключ прочитать не может —
          # `Permission denied` на старте s_server. Ослаблять права ключа вместо этого
          # нельзя: `chmod 600` там не украшение, а условие, при котором отрицательный
          # случай невозможно позеленить подменой ca.crt.
          docker run -d --name btls-upstream --network btlsnet \
            --user "$(id -u):$(id -g)" \
            --network-alias btls-probe-upstream -v "$PKI:/pki:ro" \
            --entrypoint /opt/btls/bin/openssl bee2-tls-gateway:ci \
            s_server -accept 9345 -cert /pki/leaf.crt -key /pki/leaf.key \
            -cipher DHE-BIGN-WITH-BELT-CTR-MAC-HBELT -tls1_2 -www >/dev/null
          wait_listen btls-upstream

          docker run -d --name gw-live --network btlsnet -p 127.0.0.1:1094:1080 \
            -e GW_UPSTREAM_HOST=btls-probe-upstream -e GW_UPSTREAM_PORT=9345 \
            -v "$PKI/bundle-two.pem:/etc/crypto-gw/ca/gossuok-bundle.pem:ro" \
            bee2-tls-gateway:ci >/dev/null
          wait_healthy gw-live
          code=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:1094/open-banking/v1.0/ping || true)
          gw_log=$(docker logs gw-live 2>&1)
          printf '%s\n' "$gw_log"
          echo "код ответа через шлюз: $code"
          docker rm -f gw-live >/dev/null

          # Том действительно подменён. Без этой строки монтирование могло промахнуться,
          # шлюз взял бы вшитую в образ связку ГосСУОК — и шаг проверял бы не то.
          grep -q "корни ГосСУОК: $want сертификат(ов)" <<<"$gw_log" \
            || { echo "FAIL: шлюз видит не подменённую связку" >&2; exit 1; }
          test "$code" = 200 \
            || { echo "FAIL: рукопожатие через связку из двух якорей не прошло (код $code)" >&2; exit 1; }
          echo 'ok: nginx договорился с BTLS-апстримом по связке из двух якорей'

          # ⚠ ОТРИЦАТЕЛЬНЫЙ СЛУЧАЙ, и он несущий: без него `200` выше не отличает
          # работающую проверку от снятой — сними кто-нибудь `proxy_ssl_verify on`, и
          # рукопожатие прошло бы вообще без якорей, а шаг остался бы зелёным.
          # Связка здесь — ТОЛЬКО посторонний якорь: доверять лист нечем.
          #
          # ⚠ И `502` сам по себе ничего не значит: его даёт и лежащий апстрим, и
          # непримонтированный том. Поэтому ниже требуется, чтобы апстрим был жив, шлюз
          # был healthy, а связка — именно подменённой. Иначе «проверка цепочки работает»
          # доказывалось бы тем, что что-то другое сломалось.
          docker run -d --name gw-live-bad --network btlsnet -p 127.0.0.1:1095:1080 \
            -e GW_UPSTREAM_HOST=btls-probe-upstream -e GW_UPSTREAM_PORT=9345 \
            -v "$PKI/second/ca.crt:/etc/crypto-gw/ca/gossuok-bundle.pem:ro" \
            bee2-tls-gateway:ci >/dev/null
          wait_healthy gw-live-bad
          wait_listen btls-upstream
          bad_code=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:1095/open-banking/v1.0/ping || true)
          bad_log=$(docker logs gw-live-bad 2>&1)
          printf '%s\n' "$bad_log"
          echo "код ответа через связку без нужного якоря: $bad_code"
          docker rm -f gw-live-bad >/dev/null

          grep -q 'корни ГосСУОК: 1 сертификат(ов)' <<<"$bad_log" \
            || { echo "FAIL: отрицательный случай видит не ту связку" >&2; exit 1; }
          test "$bad_code" = 502 \
            || { echo "FAIL: связка без нужного якоря дала $bad_code — проверка не работает" >&2; exit 1; }
          echo 'ok: без нужного якоря шлюз отказывает — значит 200 выше настоящий'

      # честно пропускается, а не притворяется пройденным.
      - name: Криптостек считает правильно (контрольные примеры СТБ)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash \
            -v "$PWD/scripts:/scripts:ro" \
            bee2-tls-gateway:ci /scripts/check-crypto.sh

      # ---- публикация в GHCR (#14) -------------------------------------------------
      # Только с main и только после смоука. Публикуется ТОТ ЖЕ образ, который сейчас
      # проверили: не пересборка с `push: true`, а `docker tag` уже загруженного слоя.
      # Пересборка дала бы другой digest и означала бы, что наружу уехали биты, которых
      # смоук не касался.
      - name: Логин в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация образа
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Имя пакета — в нижнем регистре: GHCR не принимает заглавные, а owner/repo
          # могут их содержать.
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo}"

          # sha-<коммит> — НЕПОДВИЖНЫЙ тег: один коммит, один образ, навсегда.
          # v1 — ПОДВИЖНЫЙ алиас: его двигает каждый мерж в main. Он существует только
          # чтобы у потребителя было что прописать до первого релиза; пинить прод по нему
          # нельзя, и в README это сказано прямо.
          docker tag bee2-tls-gateway:ci "${image}:sha-${GITHUB_SHA}"
          docker tag bee2-tls-gateway:ci "${image}:v1"
          docker push "${image}:sha-${GITHUB_SHA}"
          docker push "${image}:v1"

          # Digest — единственный идентификатор, который стоит прописывать в прод.
          # Печатаем его в сводку джобы, чтобы не искать в логах.
          # ⚠ `|| true`: образ уже опубликован, и уронить джобу на форматировании отчёта
          # значит соврать про результат — публикация состоялась, красный цвет скажет
          # обратное. Пустой digest здесь заметен глазом, а не ломает выкат.
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:v1" 2>/dev/null || true)
          [ -n "$digest" ] || digest='(не определился — взять из вывода docker push выше)'
          {
            echo "## Образ опубликован"
            echo
            echo '```'
            echo "неподвижный тег: ${image}:sha-${GITHUB_SHA}"
            echo "подвижный алиас: ${image}:v1"
            echo "для прода:       ${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest для прода: ${digest}"
