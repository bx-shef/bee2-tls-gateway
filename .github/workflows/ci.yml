name: ci

# Этот workflow — обязательная проверка (required status check) для main.
# Имя job'а `ci` должно совпадать с контекстом в .github/rulesets/main-protection.json.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell-скрипты (shellcheck)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' '*.bash')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "shell-скриптов пока нет — пропускаем"
            exit 0
          fi
          printf 'проверяю: %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: Синтаксис JSON
        run: |
          status=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if python3 -m json.tool "$f" > /dev/null; then
              echo "ok   $f"
            else
              echo "FAIL $f" >&2
              status=1
            fi
          done < <(git ls-files '*.json')
          exit "$status"

      - name: Синтаксис YAML
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import subprocess, sys, yaml

          files = subprocess.run(
              ["git", "ls-files", "*.yml", "*.yaml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()

          failed = False
          for path in files:
              try:
                  with open(path, encoding="utf-8") as fh:
                      yaml.safe_load(fh)
              except Exception as exc:
                  print(f"FAIL {path}: {exc}", file=sys.stderr)
                  failed = True
              else:
                  print(f"ok   {path}")

          sys.exit(1 if failed else 0)
          PY

      - name: Ruleset защиты main на месте
        run: |
          ruleset=.github/rulesets/main-protection.json
          if [ ! -f "$ruleset" ]; then
            echo "FAIL: $ruleset удалён — правила защиты main перестанут быть воспроизводимыми" >&2
            exit 1
          fi
          echo "ok   $ruleset"
