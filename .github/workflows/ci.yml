name: ci

# Этот workflow — обязательная проверка (required status check) для main.
# Имя job'а `ci` должно совпадать с контекстом в .github/rulesets/main-protection.json.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell-скрипты (shellcheck)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' '*.bash')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "shell-скриптов пока нет — пропускаем"
            exit 0
          fi
          printf 'проверяю: %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: Синтаксис JSON
        run: |
          status=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if python3 -m json.tool "$f" > /dev/null; then
              echo "ok   $f"
            else
              echo "FAIL $f" >&2
              status=1
            fi
          done < <(git ls-files '*.json')
          exit "$status"

      - name: Синтаксис YAML
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import subprocess, sys, yaml

          files = subprocess.run(
              ["git", "ls-files", "*.yml", "*.yaml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()

          failed = False
          for path in files:
              try:
                  with open(path, encoding="utf-8") as fh:
                      yaml.safe_load(fh)
              except Exception as exc:
                  print(f"FAIL {path}: {exc}", file=sys.stderr)
                  failed = True
              else:
                  print(f"ok   {path}")

          sys.exit(1 if failed else 0)
          PY

      - name: Конфигурация шлюза (плейсхолдеры, лог, TLS, allowlist)
        run: bash scripts/check-config.sh

      # Пины повторяются в нескольких файлах, и копия расходится с Dockerfile молча:
      # сборка не ломается, ломается смысл проверки, которая на копии стоит.
      - name: Пины согласованы между файлами
        run: bash scripts/check-pins.sh

      # Список путей — единственная граница безопасности шлюза, и с #7 её собирает КОД из
      # строки оператора. Значит у границы появились свои ошибки, и вот они проверяются:
      # что можно выразить, что нельзя, и что пустой список закрывает всё, а не открывает.
      - name: Генератор allowlist (что нельзя выразить через GW_ALLOW)
        run: bash scripts/check-allowlist.sh

      # Сторож сторожей: ломает конфиг и пины нарочно и требует, чтобы шаги выше
      # покраснели — иначе проверка, которая никогда не краснеет, неотличима в CI от
      # работающей. Так была найдена мёртвая проверка про переменные nginx (см. шапку).
      - name: Мутационная проверка (сами проверки живы?)
        run: bash scripts/check-config-mutations.sh

      - name: Штамп Last reviewed в документации
        run: |
          status=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if head -5 "$f" | grep -q '^> Last reviewed: [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$'; then
              echo "ok   $f"
            else
              echo "FAIL $f: нет строки '> Last reviewed: ГГГГ-ММ-ДД' в первых 5 строках" >&2
              status=1
            fi
          done < <(git ls-files '*.md')
          exit "$status"

  image:
    name: image
    runs-on: ubuntu-latest
    # Сборка криптостека из исходников идёт долго; отдельный job, чтобы быстрые проверки
    # отдавали результат, не дожидаясь её.
    timeout-minutes: 45
    permissions:
      contents: read
      # Нужно только для публикации в GHCR на шаге ниже; на pull request не используется,
      # потому что сам шаг туда не заходит.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      # Сборка доказывает, что криптостек компилируется, цепочка сертификатов проверяется
      # и атрибуция лицензий доехала — четыре гейта живут внутри Dockerfile. Она НЕ
      # доказывает, что контейнер стартует: между
      # ними лежит entrypoint.sh (рендер envsubst, `nginx -t`, гейты корней, переход на
      # непривилегированного пользователя, healthcheck на bash /dev/tcp). Без смоука всё это
      # впервые исполнилось бы на сервере во время выката.
      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bee2-tls-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Банк не участвует: GW_UPSTREAM_HOST — IP-литерал (значит nginx не нужен DNS и
      # `nginx -t` не может упасть на резолве), а /healthz апстрима не касается.
      - name: Смоук — контейнер стартует и отвечает
        run: |
          set -euo pipefail
          docker run -d --name gw-smoke -p 127.0.0.1:1080:1080 \
            -e GW_UPSTREAM_HOST=127.0.0.1 -e GW_UPSTREAM_PORT=9345 \
            bee2-tls-gateway:ci
          for _ in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gw-smoke)" = healthy ] && break
            sleep 2
          done
          docker logs gw-smoke
          test "$(docker inspect -f '{{.State.Health.Status}}' gw-smoke)" = healthy
          # Список путей — единственная граница безопасности шлюза. Утверждаем его СНАРУЖИ,
          # а не чтением конфига: check-config.sh проверяет намерение, смоук — поведение.
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code http://127.0.0.1:1080/healthz)" = 200
          test "$(code http://127.0.0.1:1080/)" = 404
          test "$(code http://127.0.0.1:1080/open-banking-authorize/v1.0/oauth2/token)" = 403
          test "$(code -X DELETE http://127.0.0.1:1080/open-banking/v1.0/accounts)" = 403
          # Работает непривилегированным.
          test "$(docker exec gw-smoke id -u)" = 10001
          docker rm -f gw-smoke

          # ---- allowlist действительно приходит из конфигурации (#7) ----------------
          # Утверждаем СНАРУЖИ и на ДРУГОМ списке: если бы пути остались зашиты в образ,
          # этот запуск вёл бы себя ровно как предыдущий, и подмена осталась бы незаметной.
          docker run -d --name gw-allow -p 127.0.0.1:1081:1080 \
            -e GW_UPSTREAM_HOST=127.0.0.1 -e GW_UPSTREAM_PORT=9345 \
            -e GW_ALLOW='GET /open-banking-dcr/' \
            bee2-tls-gateway:ci
          for _ in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gw-allow)" = healthy ] && break
            sleep 2
          done
          docker logs gw-allow
          test "$(docker inspect -f '{{.State.Health.Status}}' gw-allow)" = healthy
          code2() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          # Новый путь разрешён. Утверждаем КОНКРЕТНЫЙ код, а не «не 404»: `!= 404` проходит
          # и на curl-овом 000, то есть остался бы зелёным на шлюзе, который вообще молчит.
          # Апстрима нет, значит разрешённый путь обязан дать 502 — это и есть доказательство,
          # что запрос дошёл до proxy_pass, а не был отвергнут границей.
          test "$(code2 http://127.0.0.1:1081/open-banking-dcr/register)" = 502
          # А прежний, зашитый в образ, теперь закрыт — доказательство, что список сменился.
          test "$(code2 http://127.0.0.1:1081/open-banking/v1.0/accounts)" = 404
          # ⚠ Метод: список разрешает только GET, значит POST на ТОТ ЖЕ путь обязан дать 403.
          # Единственное место во всём проекте, где `limit_except` реально исполняется:
          # check-allowlist.sh выходит по GW_ALLOW_DUMP до nginx -t и видит лишь текст.
          # Без этой строки половина каждой записи GW_ALLOW не проверена ничем.
          test "$(code2 -X POST http://127.0.0.1:1081/open-banking-dcr/register)" = 403
          # И метка маршрута в логе — та, что сгенерирована из НАСТРОЕННОГО пути. Если бы
          # карта меток разъехалась с маршрутами, лог показывал бы route=none на разрешённом
          # запросе, то есть врал бы оператору, а все проверки кодов оставались бы зелёными.
          docker logs gw-allow 2>&1 | grep -q 'route=open-banking-dcr .*status=502'
          docker rm -f gw-allow

          # ---- пустой список закрывает всё, а не открывает --------------------------
          docker run -d --name gw-deny -p 127.0.0.1:1082:1080 \
            -e GW_UPSTREAM_HOST=127.0.0.1 -e GW_UPSTREAM_PORT=9345 \
            -e GW_ALLOW='' \
            bee2-tls-gateway:ci
          for _ in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gw-deny)" = healthy ] && break
            sleep 2
          done
          docker logs gw-deny
          test "$(docker inspect -f '{{.State.Health.Status}}' gw-deny)" = healthy
          code3() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code3 http://127.0.0.1:1082/healthz)" = 200
          test "$(code3 http://127.0.0.1:1082/open-banking/v1.0/accounts)" = 404
          test "$(code3 http://127.0.0.1:1082/open-banking-dcr/register)" = 404
          docker rm -f gw-deny

          # ---- самотест обязан РОНЯТЬ контейнер, а не просто печататься (#18) --------
          # Проверка, которая при провале не мешает старту, — украшение лога. Подсовываем
          # заведомо провальный bee2cmd и требуем, чтобы контейнер НЕ поднялся.
          # Ломаем через GW_BEE2CMD, а не порчей самого стека: испортить libcrypto внутри
          # образа означало бы проверять живучесть docker, а нас интересует ветка отказа
          # в entrypoint.sh — она одна и та же, чем бы самотест ни провалился.
          printf '#!/bin/sh\nexit 1\n' > /tmp/fake-bee2cmd
          chmod 0755 /tmp/fake-bee2cmd
          if docker run --rm -v /tmp/fake-bee2cmd:/tmp/fake-bee2cmd:ro \
               -e GW_UPSTREAM_HOST=127.0.0.1 -e GW_BEE2CMD=/tmp/fake-bee2cmd \
               bee2-tls-gateway:ci > /tmp/selftest.log 2>&1; then
            echo "FAIL: контейнер стартовал с провалившимся самотестом" >&2
            cat /tmp/selftest.log >&2
            exit 1
          fi
          grep -q 'самотест: контрольные примеры алгоритмов НЕ сошлись' /tmp/selftest.log
          echo 'ok: провал самотеста роняет контейнер'

      # Криптография СЧИТАЕТ ПРАВИЛЬНО — контрольные примеры СТБ 34.101.31/.45/.47/.77,
      # самотест ДСЧ, здоровье источников энтропии, обязательный криптонабор
      # МИ.10165.10.01 п. 4. До #19 это гонялось ТОЛЬКО ВРУЧНУЮ, то есть рано или поздно
      # не гонялось бы вовсе: проверка, которую надо не забыть запустить, забывается.
      # ⚠ Скрипт МОНТИРУЕТСЯ, а не копируется в образ: он инструмент проекта, а не часть
      # шлюза, и объект испытаний растить им незачем. В образе живёт только bee2cmd, и
      # живёт как документированная возможность (самотест при старте), а не как утилита.
      # Пункт 5 (сверка belt-хэша с эталоном ОАЦ) требует сети и остаётся ручным — он
      # честно пропускается, а не притворяется пройденным.
      - name: Криптостек считает правильно (контрольные примеры СТБ)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash \
            -v "$PWD/scripts:/scripts:ro" \
            bee2-tls-gateway:ci /scripts/check-crypto.sh

      # ---- публикация в GHCR (#14) -------------------------------------------------
      # Только с main и только после смоука. Публикуется ТОТ ЖЕ образ, который сейчас
      # проверили: не пересборка с `push: true`, а `docker tag` уже загруженного слоя.
      # Пересборка дала бы другой digest и означала бы, что наружу уехали биты, которых
      # смоук не касался.
      - name: Логин в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация образа
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Имя пакета — в нижнем регистре: GHCR не принимает заглавные, а owner/repo
          # могут их содержать.
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo}"

          # sha-<коммит> — НЕПОДВИЖНЫЙ тег: один коммит, один образ, навсегда.
          # v1 — ПОДВИЖНЫЙ алиас: его двигает каждый мерж в main. Он существует только
          # чтобы у потребителя было что прописать до первого релиза; пинить прод по нему
          # нельзя, и в README это сказано прямо.
          docker tag bee2-tls-gateway:ci "${image}:sha-${GITHUB_SHA}"
          docker tag bee2-tls-gateway:ci "${image}:v1"
          docker push "${image}:sha-${GITHUB_SHA}"
          docker push "${image}:v1"

          # Digest — единственный идентификатор, который стоит прописывать в прод.
          # Печатаем его в сводку джобы, чтобы не искать в логах.
          # ⚠ `|| true`: образ уже опубликован, и уронить джобу на форматировании отчёта
          # значит соврать про результат — публикация состоялась, красный цвет скажет
          # обратное. Пустой digest здесь заметен глазом, а не ломает выкат.
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:v1" 2>/dev/null || true)
          [ -n "$digest" ] || digest='(не определился — взять из вывода docker push выше)'
          {
            echo "## Образ опубликован"
            echo
            echo '```'
            echo "неподвижный тег: ${image}:sha-${GITHUB_SHA}"
            echo "подвижный алиас: ${image}:v1"
            echo "для прода:       ${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest для прода: ${digest}"
